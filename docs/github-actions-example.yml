name: UpdateSentinel

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  update-risk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build UpdateSentinel
        run: npm run build

      - name: Generate Markdown report
        run: node dist/cli.js scan examples/risky-compose.yml --format markdown --fail-on none

      - name: Generate JSON report
        run: node dist/cli.js scan examples/risky-compose.yml --format json --fail-on none > updatesentinel-report.json

      # This step intentionally fails for examples/risky-compose.yml because it has high-risk findings.
      # Replace the path with your own Compose file before using this as a blocking CI gate.
      - name: Fail when high-risk findings exist
        run: node dist/cli.js scan examples/risky-compose.yml --format markdown --fail-on high
